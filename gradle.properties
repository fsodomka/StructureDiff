# IntelliJ IDEA version to compile against, run and verify (downloaded by Gradle)
platformVersion=2026.2.3
# To use a local IntelliJ installation instead, set platformLocalPath in ~/.gradle/gradle.properties
# or pass -PplatformLocalPath=<path>, e.g. platformLocalPath=C:/Program Files/JetBrains/IntelliJ IDEA
org.gradle.jvmargs=-Xmx2g
